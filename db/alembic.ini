# A generic, single database configuration.

[alembic]
# Path to migration scripts
# Use %(here)s so the path is relative to alembic.ini location
script_location = %(here)s/migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with current directory
prepend_sys_path = .

# Timezone to use when generating timestamps in migration files
# timezone = UTC

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a .py file to be detected
# sourceless = false

# Version location specification; this defaults to migrations/versions.
version_locations = %(here)s/migrations/versions

# The output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

# Default database connection string (can be overridden via DATABASE_URL env var)
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/ats_checker_db

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
