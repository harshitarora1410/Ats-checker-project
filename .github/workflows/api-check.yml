name: API check

# Manual test: is the Claude API key (secret ANTHROPIC_API_KEY) working or not?
# Run it: GitHub > Actions > API check > Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-key-check:
    name: Check Claude API key
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Anthropic SDK
        run: pip install --quiet anthropic

      - name: Test the API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: python
        run: |
          import os, sys
          import anthropic

          key = os.environ.get("ANTHROPIC_API_KEY", "").strip()
          if not key:
              print("::error::ANTHROPIC_API_KEY secret is missing. Add it in repo Settings > Secrets and variables > Actions.")
              sys.exit(1)

          try:
              client = anthropic.Anthropic(api_key=key, timeout=30, max_retries=1)
              reply = client.messages.create(
                  model="claude-haiku-5-5",
                  max_tokens=5,
                  messages=[{"role": "user", "content": "Reply with OK."}],
              )
          except anthropic.AuthenticationError:
              print("::error::API key is NOT working: the key is wrong or has been deactivated.")
              sys.exit(1)
          except anthropic.PermissionDeniedError:
              print("::error::API key is valid but has no access to this model.")
              sys.exit(1)
          except anthropic.RateLimitError:
              print("::error::API key is valid but the rate limit or credit balance is exhausted.")
              sys.exit(1)
          except anthropic.APIError as exc:
              print(f"::error::API call failed: {type(exc).__name__}: {exc}")
              sys.exit(1)

          print(f"API key is WORKING. Model {reply.model} answered.")