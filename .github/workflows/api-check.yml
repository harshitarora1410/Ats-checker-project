name: API check

# Manual only: GitHub > Actions > API check > Run workflow.
# Result: "API is LIVE" or "API FAILED".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-key-check:
    name: Claude API key
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet anthropic

      - name: Result
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: python
        run: |
          import os, sys

          def finish(live, reason=""):
              line = "✅ API is LIVE" if live else f"❌ API FAILED — {reason}"
              print(line)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(f"## {line}\n")
              sys.exit(0 if live else 1)

          key = os.environ.get("ANTHROPIC_API_KEY", "").strip()
          if not key:
              finish(False, "secret missing")

          import anthropic
          try:
              anthropic.Anthropic(api_key=key, timeout=30, max_retries=1).messages.create(
                  model="claude-haiku-5-5",
                  max_tokens=5,
                  messages=[{"role": "user", "content": "Reply with OK."}],
              )
          except anthropic.AuthenticationError:
              finish(False, "wrong or deactivated key")
          except anthropic.PermissionDeniedError:
              finish(False, "no access to model")
          except anthropic.RateLimitError:
              finish(False, "rate limit or no credit")
          except Exception as exc:
              finish(False, type(exc).__name__)

          finish(True)