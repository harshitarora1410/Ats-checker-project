[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-ai"
version = "0.1.0"
description = "LLM scoring engine for the ATS Score Checker"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ats_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]