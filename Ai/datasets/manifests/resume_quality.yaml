# Dataset manifest - one per dataset. Safe to commit: NO resume text, NO personal data here.
name: Resume Quality
slot: resume_quality                   # which model slot this dataset trains
task_output: "Quality dimensions + rating"
base_model: "DeBERTa classifier/regressor"
eval_metrics: "MAE, correlation, human agreement"

source:
  provider: null               # e.g. Kaggle, Hugging Face, internal
  url: null
  license: null                # MUST be filled and checked before training
  downloaded_at: null          # YYYY-MM-DD
  raw_files: []                # file names inside datasets/raw/resume_quality/
  sha256: {}                   # file name -> checksum, to detect changes

contents:
  expected_records: null
  actual_records: null
  columns: []                  # column names after inspection
  label_column: null
  label_values: []             # e.g. [Good Fit, Potential Fit, No Fit]
  class_balance: {}            # label -> count

cleaning:
  duplicates_removed: null
  pii_redacted: false          # emails, phones, addresses removed before training
  empty_or_broken_removed: null

splits:                        # grouped by candidate/resume to avoid leakage
  method: null                 # e.g. group_shuffle_split by resume_id
  seed: 42
  train: null
  val: null
  test: null

status: not_downloaded         # not_downloaded | raw | cleaned | split | used_for_training
notes: "No labels yet. Needs CareerCorpus plus our own annotations using an agreed rubric (see datasets/labeled/resume_quality/)."
